<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorul 03 – JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina">
    <header class="antet">
      <div>
        <p class="supratitlu">DAW · JavaScript, DOM și fetch</p>
        <h1 id="titlu">Laboratorul 03</h1>
      </div>
      <div class="actiuni">
        <button id="btn-tema" type="button" class="buton buton-secundar">Schimbă tema</button>
        <!-- Exercițiul 1: butonul Resetează -->
        <button id="btn-reset" type="button" class="buton buton-secundar">Resetează</button>
      </div>
    </header>

    <section class="card">
      <h2>Formular</h2>
      <form id="formular" novalidate>
        <label for="nume">Numele vostru</label>
        <div class="rand">
          <input id="nume" type="text" autocomplete="name" placeholder="de exemplu, Iulian">
          <button type="submit" class="buton">Trimite</button>
        </div>
        <p id="eroare-nume" class="eroare"></p>
      </form>
      <p class="previzualizare">Previzualizare: Salut, <strong id="previzualizare">...</strong>!</p>
    </section>

    <section class="card">
      <h2 id="titlu-vreme">Vremea în Bacău</h2>

      <!-- Opționalul 4, extins: toate județele țării (lista se completează din JavaScript) -->
      <label for="oras">Județul</label>
      <div class="rand">
        <select id="oras"></select>
        <button id="btn-vreme" type="button" class="buton">Afișează vremea</button>
      </div>

      <p id="stare" class="stare"></p>

      <!-- Panoul principal: ascuns până sosesc datele -->
      <div id="vreme-principal" class="vreme-principal" hidden>
        <span id="vreme-icon" class="vreme-icon" aria-hidden="true"></span>
        <div>
          <p id="vreme-temp" class="vreme-temp"></p>
          <p id="vreme-desc" class="vreme-desc"></p>
        </div>
        <span id="vreme-eticheta" class="eticheta"></span>
      </div>

      <ul id="vreme" class="vreme"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
